<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title data-i18n="app.title"></title>

    <!-- One page drawn like an old ink-on-paper architectural sheet.
         profile.css only supplies the letter-by-letter mechanics of the name; every look is in manuscript.css. -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Kalam:wght@400;700&family=Yatra+One&display=swap" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.1/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" href="src/features/profile/view/profile.css">
    <link rel="stylesheet" href="src/shared/styles/manuscript.css">
    <link rel="stylesheet" href="src/features/skyline/view/skyline.css">
    <link rel="stylesheet" href="src/features/cursor-effects/view/cursor-effects.css">
</head>
<body>

    <!-- Line art reused on the sheet, and the filter that makes drawn lines wobble like a pen -->
    <svg class="ink-defs" aria-hidden="true">
        <defs>
            <filter id="ink-wobble" x="-5%" y="-5%" width="110%" height="110%">
                <feTurbulence type="fractalNoise" baseFrequency="0.035" numOctaves="2" seed="4" result="noise"/>
                <feDisplacementMap in="SourceGraphic" in2="noise" scale="2.2"/>
            </filter>

            <!-- A pillar: crowned finial, bowl capital, bracket, shaft -->
            <symbol id="pillar" viewBox="0 0 120 320">
                <rect x="38" y="4" width="46" height="46"/>
                <path d="M45 46 V22 L53 10 L61 24 L69 10 L77 22 V46"/>
                <path d="M55 46 V30 H67 V46"/>
                <rect x="28" y="50" width="66" height="10"/>
                <path d="M2 60 H116 L107 88 H12 Z"/>
                <path d="M10 64 Q22 82 40 66"/>
                <path d="M12 88 H107 V96 H12 Z"/>
                <path d="M20 96 H100 Q96 118 78 120 H42 Q24 118 20 96 Z"/>
                <rect x="38" y="120" width="46" height="10"/>
                <path d="M45 130 V320 M77 130 V320"/>
            </symbol>
        </defs>
    </svg>

    <!-- Settings feature: light or dark, and the size of the text -->
    <button id="settings-toggle" class="settings-toggle" data-i18n-title="settings.toggle">
        <i class="fas fa-cog"></i>
    </button>

    <div id="settings-panel" class="settings-panel">
        <div class="settings-header">
            <h3 data-i18n="settings.title"></h3>
            <button id="close-settings" class="settings-close" data-i18n-title="settings.close">
                <i class="fas fa-times"></i>
            </button>
        </div>

        <div class="settings-section">
            <span class="settings-label" data-i18n="settings.theme.label"></span>
            <div class="settings-options">
                <button class="theme-btn" data-theme="default">
                    <i class="fas fa-sun"></i> <span data-i18n="settings.theme.light"></span>
                </button>
                <button class="theme-btn" data-theme="dark">
                    <i class="fas fa-moon"></i> <span data-i18n="settings.theme.dark"></span>
                </button>
            </div>
        </div>

        <div class="settings-section">
            <span class="settings-label" data-i18n="settings.size.label"></span>
            <div class="settings-options">
                <button id="text-size-decrease" class="size-btn" data-i18n-title="settings.size.smaller">
                    <i class="fas fa-minus"></i>
                </button>
                <span id="text-size-value" class="size-value"></span>
                <button id="text-size-increase" class="size-btn" data-i18n-title="settings.size.larger">
                    <i class="fas fa-plus"></i>
                </button>
            </div>
        </div>
    </div>

    <main class="sheet" data-ink-box="top left right" data-ink-double="left right">
        <p class="sheet-caption" data-i18n="app.title"></p>

        <!-- Two pillars carrying the name panel -->
        <section class="shrine">
            <svg class="pillar ink-drawing" aria-hidden="true"><use href="#pillar"/></svg>
            <div class="shrine-panel">
                <div class="cover-content" id="profile-container"></div>
            </div>
            <svg class="pillar pillar--mirrored ink-drawing" aria-hidden="true"><use href="#pillar"/></svg>
        </section>

        <!-- The stepped plinth the pillars stand on -->
        <svg class="plinth ink-drawing" viewBox="0 0 800 92" preserveAspectRatio="none" aria-hidden="true">
            <rect x="120" y="4" width="560" height="10"/>
            <rect x="104" y="14" width="592" height="10"/>
            <path d="M72 52 V38 Q72 24 100 24 H700 Q728 24 728 38 V52 Z"/>
            <rect x="44" y="52" width="712" height="12"/>
            <rect x="20" y="64" width="760" height="24"/>
        </svg>

        <!-- The chamber under the plinth -->
        <section class="chamber" data-ink-box="top right bottom left">
            <div id="overview-container"></div>
        </section>

        <div class="fold" aria-hidden="true"></div>

        <section class="ledger">
            <article class="ledger-box ledger-box--wide" data-ink-box="top right bottom left">
                <h2 class="ledger-label" data-i18n="projects.header"></h2>
                <div id="projects-container"></div>
            </article>

            <article class="ledger-box" data-ink-box="top right bottom left">
                <h2 class="ledger-label" data-i18n="skills.header"></h2>
                <div id="skills-container"></div>
            </article>

            <article class="ledger-box" data-ink-box="top right bottom left">
                <h2 class="ledger-label" data-i18n="languages.header"></h2>
                <div id="languages-container"></div>
            </article>

            <article class="ledger-box ledger-box--wide" data-ink-box="top right bottom left">
                <h2 class="ledger-label" data-i18n="experience.header"></h2>
                <div id="experience-container"></div>
            </article>

            <article class="ledger-box ledger-box--wide" data-ink-box="top right bottom left">
                <h2 class="ledger-label" data-i18n="education.header"></h2>
                <div id="education-container"></div>
            </article>
        </section>
    </main>

    <script type="module" src="src/app/main.js"></script>
</body>
</html>
